<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>imovercovidmaylee</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"></script>

<style>
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
header{display:flex;justify-content:space-between;padding:20px;background:#111}
.logo{color:#e50914;font-size:26px}

#banner{
height:300px;
background-size:cover;
display:flex;
align-items:flex-end;
padding:20px;
}

.videos{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:15px;
padding:20px;
}

.card{cursor:pointer;position:relative}
.card img{width:100%;height:130px;object-fit:cover;border-radius:8px}

.vip{
position:absolute;
top:10px;
left:10px;
background:gold;
color:black;
padding:3px 6px;
}

#modal{
display:none;
position:fixed;
top:0;left:0;width:100%;height:100%;
background:black;
justify-content:center;
align-items:center;
}

#modal video,#modal img{max-width:90%}

.panel{background:#111;padding:20px;margin:20px}

button{background:#e50914;border:none;padding:10px;color:white;cursor:pointer}

.wallet{background:#222;padding:10px;margin:10px 0}

footer{text-align:center;padding:20px;background:#111}
</style>
</head>

<body>

<header>
<div class="logo">imovercovidmaylee</div>
<button onclick="logout()">Logout</button>
</header>

<!-- AUTH -->
<div class="panel">
<h3>Account</h3>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
</div>

<!-- BANNER -->
<div id="banner"><h2 id="bannerTitle">Featured</h2></div>

<h2 style="padding-left:20px;">Free</h2>
<div id="free" class="videos"></div>

<h2 style="padding-left:20px;">VIP</h2>
<div id="vip" class="videos"></div>

<!-- PAYMENT -->
<div class="panel">
<h2>Bitcoin Payment</h2>

<div class="wallet" onclick="copyWallet()">
BTC: 1JxRkqmF31wb8zJWYGanDNBK2aWKxg9pJ8
</div>

<a href="bitcoin:1JxRkqmF31wb8zJWYGanDNBK2aWKxg9pJ8">
<button>Pay with Bitcoin</button>
</a>

<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=bitcoin:1JxRkqmF31wb8zJWYGanDNBK2aWKxg9pJ8">

<button onclick="requestVIP()">I HAVE PAID</button>
</div>

<!-- ADMIN -->
<div class="panel">
<h3>Admin</h3>

<input type="file" id="file">
<input id="title" placeholder="Title">
<label>VIP</label><input type="checkbox" id="vipCheck">

<button onclick="upload()">Upload Video/Image</button>

<hr>

<input type="file" id="bannerFile">
<input id="bannerText" placeholder="Banner Title">
<button onclick="setBanner()">Set Banner</button>

</div>

<!-- MODAL -->
<div id="modal" onclick="closeModal()"></div>

<footer>
<p>Contact:</p>
<a href="https://t.me/maylee_covid0001">@maylee_covid0001</a>
</footer>

<script>

/* FIREBASE CONFIG */
const firebaseConfig={
apiKey:"YOUR_KEY",
authDomain:"YOUR_PROJECT.firebaseapp.com",
projectId:"YOUR_PROJECT",
storageBucket:"YOUR_PROJECT.appspot.com"
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.firestore();
const storage=firebase.storage();

/* AUTH */
function register(){
auth.createUserWithEmailAndPassword(email.value,password.value);
}

function login(){
auth.signInWithEmailAndPassword(email.value,password.value);
}

function logout(){
auth.signOut();
}

/* USER STATE */
let currentUser=null;

auth.onAuthStateChanged(user=>{
currentUser=user;
loadVideos();
});

/* LOAD VIDEOS */
function loadVideos(){
db.collection("videos").onSnapshot(snap=>{
free.innerHTML="";
vip.innerHTML="";

snap.forEach(doc=>{
let v=doc.data();

let d=document.createElement("div");
d.className="card";

d.innerHTML=`<img src="${v.thumb}">
${v.vip?'<div class="vip">VIP</div>':''}`;

d.onclick=()=>play(v);

if(v.vip) vip.appendChild(d);
else free.appendChild(d);
});
});
}

/* PLAY */
function play(v){

if(v.vip){
db.collection("users").doc(currentUser.uid).get().then(doc=>{
if(!doc.data()?.vip){
alert("VIP required");
return;
}
open(v);
});
}else{
open(v);
}
}

function open(v){
modal.innerHTML=v.src.match(/\.(jpg|png)/)?
`<img src="${v.src}">`:
`<video src="${v.src}" controls autoplay></video>`;
modal.style.display="flex";
}

function closeModal(){
modal.style.display="none";
}

/* UPLOAD */
function upload(){

const file=document.getElementById("file").files[0];

let ref=storage.ref("videos/"+file.name);

ref.put(file).then(()=>{
ref.getDownloadURL().then(url=>{

db.collection("videos").add({
src:url,
thumb:url,
vip:vipCheck.checked
});

});
});
}

/* VIP REQUEST */
function requestVIP(){
db.collection("users").doc(currentUser.uid).set({vip:true},{merge:true});
alert("VIP activated (manual)");
}

/* BANNER */
function setBanner(){
const file=bannerFile.files[0];

let ref=storage.ref("banner/"+file.name);

ref.put(file).then(()=>{
ref.getDownloadURL().then(url=>{
banner.style.backgroundImage=`url(${url})`;
bannerTitle.innerText=bannerText.value;
});
});
}

/* WALLET */
function copyWallet(){
navigator.clipboard.writeText("1JxRkqmF31wb8zJWYGanDNBK2aWKxg9pJ8");
alert("Copied");
}

</script>

</body>
</html>
