<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>imovercovidmaylee</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<style>
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}

/* HEADER */
header{
display:flex;
justify-content:space-between;
padding:20px;
background:#111;
}

.logo{color:#e50914;font-size:26px}

/* BANNER */
#banner{
height:250px;
background:#000;
background-size:cover;
display:flex;
align-items:flex-end;
padding:20px;
}

/* GRID */
.videos{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:15px;
padding:20px;
}

.card{cursor:pointer;position:relative}
.card img{
width:100%;
height:130px;
object-fit:cover;
border-radius:8px;
}

.vip{
position:absolute;
top:10px;
left:10px;
background:gold;
color:black;
padding:3px 6px;
}

/* MODAL */
#modal{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:black;
justify-content:center;
align-items:center;
}

#modal video,#modal img{max-width:90%}

/* SECTIONS */
.payment,.admin{padding:20px;background:#111;margin-top:20px}

.wallet{background:#222;padding:10px;margin:10px 0;cursor:pointer}

button{
padding:10px;
background:#e50914;
border:none;
color:white;
cursor:pointer;
margin-top:5px;
}

footer{
text-align:center;
padding:20px;
background:#111;
}
</style>
</head>

<body>

<header>
<div class="logo">imovercovidmaylee</div>
</header>

<!-- BANNER -->
<div id="banner">
<h2 id="bannerTitle">Featured</h2>
</div>

<!-- LOGIN -->
<div style="padding:20px;">
<input id="username" placeholder="Enter username">
<button onclick="login()">Login</button>
</div>

<h2 style="padding-left:20px;">Free Videos</h2>
<div id="free" class="videos"></div>

<h2 style="padding-left:20px;">VIP Videos</h2>
<div id="vip" class="videos"></div>

<!-- PAYMENT -->
<div class="payment">
<h2>Pay with Bitcoin</h2>

<div class="wallet" onclick="copyWallet()">
BTC: 1JxRkqmF31wb8zJWYGanDNBK2aWKxg9pJ8
</div>

<a href="bitcoin:1JxRkqmF31wb8zJWYGanDNBK2aWKxg9pJ8?amount=0.002">
<button>Pay with Bitcoin</button>
</a>

<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=bitcoin:1JxRkqmF31wb8zJWYGanDNBK2aWKxg9pJ8">

<br>
<button onclick="requestAccess()">I HAVE PAID</button>
</div>

<!-- ADMIN -->
<div class="admin">
<h3>Admin Panel</h3>

<input id="thumb" placeholder="Thumbnail URL">
<input id="src" placeholder="Video/Image URL">
<label>VIP</label>
<input type="checkbox" id="isVip">

<button onclick="addVideo()">Add Video (Global)</button>

<hr>

<h4>Upload from Phone (Local only)</h4>
<input type="file" id="videoUpload" accept="video/*">
<input type="file" id="thumbUpload" accept="image/*">
<button onclick="uploadLocal()">Upload Local</button>

<hr>

<h4>Set Banner</h4>
<input type="file" id="bannerUpload">
<input id="bannerText" placeholder="Banner Title">
<button onclick="setBanner()">Set Banner</button>

</div>

<!-- MODAL -->
<div id="modal" onclick="closeModal()"></div>

<!-- FOOTER -->
<footer>
<p>Admin Telegram:</p>
<a href="https://t.me/maylee_covid0001" target="_blank">@maylee_covid0001</a>
</footer>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey:"YOUR_KEY",
  authDomain:"YOUR_PROJECT.firebaseapp.com",
  projectId:"YOUR_PROJECT"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

/* USER */
let currentUser=localStorage.getItem("user");
let paidUsers=JSON.parse(localStorage.getItem("paidUsers")||"[]");

/* LOGIN */
function login(){
currentUser=username.value;
localStorage.setItem("user",currentUser);
alert("Logged in");
}

/* LOAD GLOBAL VIDEOS */
function loadVideos(){
db.collection("videos").onSnapshot(snapshot=>{
free.innerHTML="";
vip.innerHTML="";

snapshot.forEach(doc=>{
let v=doc.data();

let d=document.createElement("div");
d.className="card";

d.innerHTML=`
<img src="${v.thumb}">
${v.vip?'<div class="vip">VIP</div>':''}
`;

d.onclick=()=>play(v);

if(v.vip) vip.appendChild(d);
else free.appendChild(d);
});
});
}

/* PLAY */
function play(v){
if(v.vip && !paidUsers.includes(currentUser)){
alert("VIP locked");
return;
}

let modal=document.getElementById("modal");

if(v.src.match(/\.(jpg|png|jpeg|gif)$/)){
modal.innerHTML=`<img src="${v.src}">`;
}else{
modal.innerHTML=`<video src="${v.src}" controls autoplay></video>`;
}

modal.style.display="flex";
}

/* CLOSE */
function closeModal(){
modal.style.display="none";
}

/* COPY WALLET */
function copyWallet(){
navigator.clipboard.writeText("1JxRkqmF31wb8zJWYGanDNBK2aWKxg9pJ8");
alert("Copied");
}

/* PAYMENT */
function requestAccess(){
if(!currentUser){alert("Login first");return;}
paidUsers.push(currentUser);
localStorage.setItem("paidUsers",JSON.stringify(paidUsers));
alert("Access granted");
}

/* ADD VIDEO (GLOBAL) */
function addVideo(){
db.collection("videos").add({
thumb:thumb.value,
src:src.value,
vip:isVip.checked
});
alert("Added globally");
}

/* LOCAL UPLOAD */
function uploadLocal(){
const v=document.getElementById("videoUpload").files[0];
const t=document.getElementById("thumbUpload").files[0];

if(!v){alert("Select video");return;}

let videoURL=URL.createObjectURL(v);
let thumbURL=t?URL.createObjectURL(t):"https://via.placeholder.com/300x170";

let obj={src:videoURL,thumb:thumbURL,vip:false};

let d=document.createElement("div");
d.className="card";
d.innerHTML=`<img src="${obj.thumb}">`;
d.onclick=()=>play(obj);

free.appendChild(d);
}

/* BANNER */
function setBanner(){
const file=document.getElementById("bannerUpload").files[0];
const text=document.getElementById("bannerText").value;

if(!file){alert("Upload image");return;}

let url=URL.createObjectURL(file);

banner.style.backgroundImage=`url(${url})`;
bannerTitle.innerText=text||"Featured";
}

/* INIT */
loadVideos();

</script>

</body>
</html>
