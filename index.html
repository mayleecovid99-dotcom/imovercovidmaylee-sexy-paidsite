<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>imovercovidmaylee</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial,sans-serif;background:#0b0b0b;color:white;}
header{background:#111;padding:15px 30px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;}
header h1{color:#e50914;font-size:26px;}
nav a{color:#ddd;margin-left:20px;text-decoration:none;}

/* HERO */
.hero{position:relative;height:65vh;width:100%;overflow:hidden;}
.hero img{width:100%;height:100%;object-fit:cover;filter:brightness(60%);}
.hero-content{position:absolute;bottom:50px;left:40px;}
.hero-content h2{font-size:45px;margin-bottom:10px;}
.hero-content p{max-width:400px;margin-bottom:15px;color:#ddd;}
.hero-content button{background:#e50914;border:none;padding:12px 25px;color:white;font-size:18px;cursor:pointer;border-radius:4px;}

/* CONTAINER */
.container{padding:30px;}
.row{margin-bottom:40px;}
.row h2{margin-bottom:15px;}
.videos{display:flex;gap:15px;overflow-x:auto;}
.video-card{min-width:200px;cursor:pointer;position:relative;}
.video-card img{width:100%;border-radius:6px;}
.vip{position:absolute;top:10px;left:10px;background:gold;color:black;padding:3px 8px;font-size:12px;font-weight:bold;border-radius:4px;}

/* MODAL */
#videoModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);justify-content:center;align-items:center;z-index:999;}
#videoModal video{max-width:90%;max-height:85%;}
.close{position:absolute;top:20px;right:35px;font-size:40px;cursor:pointer;}

/* ADMIN PANEL */
#adminPanel{display:none;position:fixed;top:80px;right:30px;width:320px;background:#1f1f1f;padding:25px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.7);z-index:200;}
#adminPanel input,#adminPanel select{margin-bottom:15px;padding:12px;width:100%;border-radius:6px;border:none;background:#2c2c2c;color:#fff;}
#adminPanel button{padding:12px;background:#e50914;color:#fff;border:none;cursor:pointer;border-radius:6px;font-size:16px;width:100%;}
#adminDots{font-size:28px;cursor:pointer;color:#fff;}
</style>
</head>
<body>

<header>
<h1>imovercovidmaylee</h1>
<nav>
<a href="#">Home</a>
<a href="#">VIP</a>
<a href="#">Login</a>
</nav>
<div id="adminDots" onclick="toggleAdmin()">⋮</div>
</header>

<!-- HERO -->
<div class="hero">
<img src="banner.jpg">
<div class="hero-content">
<h2>Featured Video</h2>
<p>Watch the latest exclusive videos on our platform.</p>
<button onclick="alert('Play featured video')">▶ Play</button>
</div>
</div>

<!-- PURCHASE BANNER -->
<div id="purchaseBanner" style="background:#1a1a1a;padding:12px 30px;border-bottom:2px solid #e50914;display:flex;justify-content:space-between;">
<p>🌟 Get unlimited access to all VIP videos for a one-time fee of <strong>$100</strong></p>
<button onclick="purchasePackage()">Buy Full Access</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">
<h3>Admin Panel</h3>
<input type="text" id="videoTitle" placeholder="Video Title">
<input type="file" id="videoThumbnail" accept="image/*">
<input type="text" id="videoSrc" placeholder="Video URL (.mp4)">
<select id="videoType">
<option value="free">Free</option>
<option value="vip">VIP</option>
</select>
<button onclick="addVideo()">Add Video</button>
</div>

<div class="container">
<div class="row">
<h2>Free Videos</h2>
<div class="videos" id="freeVideos"></div>
</div>
<div class="row">
<h2>VIP Videos</h2>
<div class="videos" id="vipVideos"></div>
</div>
</div>

<!-- VIDEO MODAL -->
<div id="videoModal">
<span class="close" onclick="closeVideo()">&times;</span>
<video controls id="player"></video>
</div>

<script>
// Admin + videos
const freeVideos=[];
const vipVideos=[];
const freeVideosContainer=document.getElementById('freeVideos');
const vipVideosContainer=document.getElementById('vipVideos');
const videoModal=document.getElementById('videoModal');
const modalVideo=document.getElementById('player');
const adminPanel=document.getElementById('adminPanel');

const ADMIN_PASSWORD="1234";
const PAID_KEY="paid_access";
let paid=localStorage.getItem(PAID_KEY)==="true";

// PURCHASE
function purchasePackage(){
if(confirm("Confirm purchase for $100?")){
paid=true;
localStorage.setItem(PAID_KEY,"true");
alert("VIP videos unlocked");
}
}

// ADMIN PANEL
function toggleAdmin(){
let password=prompt("Enter admin password");
if(password===ADMIN_PASSWORD){
adminPanel.style.display = adminPanel.style.display==="block"?"none":"block";
}
}

// ADD VIDEO (with gallery upload)
function addVideo(){
const title=document.getElementById("videoTitle").value;
const thumbnailInput=document.getElementById("videoThumbnail");
const src=document.getElementById("videoSrc").value;
const type=document.getElementById("videoType").value;

if(!title||!src||thumbnailInput.files.length===0){
alert("Enter title, video and thumbnail");
return;
}

const reader=new FileReader();
reader.onload=function(e){
const video={id:Date.now(),title:title,thumbnail:e.target.result,src:src};
if(type==="free"){freeVideos.push(video);}else{vipVideos.push(video);}
renderVideos("free");
renderVideos("vip");
};
reader.readAsDataURL(thumbnailInput.files[0]);
}

// RENDER VIDEOS
function renderVideos(type){
let container=type==="free"?freeVideosContainer:vipVideosContainer;
let videos=type==="free"?freeVideos:vipVideos;
container.innerHTML="";
videos.forEach(video=>{
const card=document.createElement("div");
card.className="video-card";
const img=document.createElement("img");
img.src=video.thumbnail;
card.appendChild(img);
if(type==="vip"){
const badge=document.createElement("div");
badge.className="vip";
badge.textContent="VIP";
card.appendChild(badge);
}
card.onclick=()=>playVideo(video.src,type);
container.appendChild(card);
});
}

// PLAY & CLOSE MODAL
function playVideo(src,type){
if(type==="vip"&&!paid){if(confirm("This is VIP content. Buy access?")){purchasePackage();} return;}
modalVideo.src=src;
videoModal.style.display="flex";
}
function closeVideo(){videoModal.style.display="none";modalVideo.pause();modalVideo.src="";}
renderVideos("free");
renderVideos("vip");
</script>

</body>
</html>
