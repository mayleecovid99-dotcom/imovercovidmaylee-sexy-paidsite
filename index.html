<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChrisFlix</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
}

/* header */
header {
  display:flex;
  justify-content:space-between;
  padding:15px 20px;
  background:#111;
  position:sticky;
  top:0;
}

header h1 { color:#e50914; }
#adminDots { cursor:pointer; font-size:24px; }

/* banner */
#banner {
  background:#1a1a1a;
  padding:12px;
  text-align:center;
}

/* grid */
.videos {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:15px;
  padding:20px;
}

.video-card {
  position:relative;
  cursor:pointer;
  transition:0.3s;
}

.video-card:hover { transform:scale(1.05); }

.video-card img {
  width:100%;
  height:140px;
  object-fit:cover;
  border-radius:8px;
}

/* play overlay */
.video-card::after {
  content:"▶ Play";
  position:absolute;
  bottom:10px;
  left:10px;
  background:rgba(0,0,0,0.7);
  padding:5px 10px;
  border-radius:5px;
  font-size:12px;
}

/* VIP badge */
.vip {
  position:absolute;
  top:10px;
  left:10px;
  background:gold;
  color:black;
  padding:3px 6px;
  font-size:12px;
  border-radius:3px;
}

/* delete btn */
.delete {
  position:absolute;
  top:10px;
  right:10px;
  background:red;
  width:25px;
  height:25px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
}

/* modal */
#modal {
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  justify-content:center;
  align-items:center;
  z-index:1000;
}

#modal img, #modal video {
  max-width:90%;
  border-radius:10px;
}

/* admin */
#adminPanel {
  display:none;
  position:fixed;
  right:20px;
  top:80px;
  background:#222;
  padding:15px;
  border-radius:10px;
  width:250px;
}

input, select, button {
  width:100%;
  margin:5px 0;
  padding:10px;
}

button {
  background:#e50914;
  color:white;
  border:none;
  cursor:pointer;
}

button:hover { background:#b2070f; }
</style>
</head>

<body>

<header>
<h1>ChrisFlix</h1>
<div id="adminDots" onclick="toggleAdmin()">⋮</div>
</header>

<div id="banner">
🔒 VIP content locked — Contact admin after payment
</div>

<h2 style="padding-left:20px;">🎬 Free</h2>
<div id="free" class="videos"></div>

<h2 style="padding-left:20px;">👑 VIP</h2>
<div id="vip" class="videos"></div>

<!-- modal -->
<div id="modal" onclick="closeModal()"></div>

<!-- admin -->
<div id="adminPanel">
<input id="title" placeholder="Title">
<input id="thumb" placeholder="Thumbnail URL">
<input id="src" placeholder="Video/Image URL">
<select id="type">
<option value="free">Free</option>
<option value="vip">VIP</option>
</select>
<button onclick="addContent()">Add Content</button>
</div>

<script>
let freeVideos=[];
let vipVideos=[];
let paid = localStorage.getItem("paid")==="true";
let adminOpen=false;

/* render */
function render(){
  document.getElementById("free").innerHTML="";
  document.getElementById("vip").innerHTML="";

  freeVideos.forEach(v=>createCard(v,"free"));
  vipVideos.forEach(v=>createCard(v,"vip"));
}

/* create card */
function createCard(v,type){
  let div=document.createElement("div");
  div.className="video-card";

  let img=document.createElement("img");
  img.src=v.thumb || "https://via.placeholder.com/300x170";
  div.appendChild(img);

  if(type==="vip"){
    let vip=document.createElement("div");
    vip.className="vip";
    vip.innerText="VIP";
    div.appendChild(vip);
  }

  if(adminOpen){
    let del=document.createElement("div");
    del.className="delete";
    del.innerHTML="🗑";
    del.onclick=(e)=>{
      e.stopPropagation();
      deleteContent(v.id,type);
    };
    div.appendChild(del);
  }

  div.onclick=()=>playMedia(v.src,type);
  document.getElementById(type).appendChild(div);
}

/* play media */
function playMedia(src,type){
  if(type==="vip" && !paid){
    alert("VIP locked. Contact admin.");
    return;
  }

  let modal=document.getElementById("modal");
  modal.innerHTML="";

  if(src.match(/\.(jpg|png|jpeg|gif|webp)$/i)){
    let img=document.createElement("img");
    img.src=src;
    modal.appendChild(img);
  } else {
    let vid=document.createElement("video");
    vid.src=src;
    vid.controls=true;
    vid.autoplay=true;
    modal.appendChild(vid);
  }

  modal.style.display="flex";
}

/* close modal */
function closeModal(){
  document.getElementById("modal").style.display="none";
}

/* admin */
function toggleAdmin(){
  let pass=prompt("Admin password:");
  if(pass==="1234"){
    adminOpen=!adminOpen;
    document.getElementById("adminPanel").style.display=adminOpen?"block":"none";
    render();
  } else if(pass!==null){
    alert("Wrong password");
  }
}

/* add */
function addContent(){
  let v={
    id:Date.now(),
    title:title.value,
    thumb:thumb.value,
    src:src.value
  };

  if(type.value==="free") freeVideos.push(v);
  else vipVideos.push(v);

  save();
  render();
}

/* delete */
function deleteContent(id,type){
  if(type==="free"){
    freeVideos=freeVideos.filter(v=>v.id!==id);
  } else {
    vipVideos=vipVideos.filter(v=>v.id!==id);
  }
  save();
  render();
}

/* save/load */
function save(){
  localStorage.setItem("free",JSON.stringify(freeVideos));
  localStorage.setItem("vip",JSON.stringify(vipVideos));
}

function load(){
  freeVideos=JSON.parse(localStorage.getItem("free")||"[]");
  vipVideos=JSON.parse(localStorage.getItem("vip")||"[]");

  /* default samples */
  if(freeVideos.length===0){
    freeVideos.push({
      id:1,
      thumb:"https://via.placeholder.com/300x170?text=Free",
      src:"https://www.w3schools.com/html/mov_bbb.mp4"
    });
  }

  if(vipVideos.length===0){
    vipVideos.push({
      id:2,
      thumb:"https://via.placeholder.com/300x170?text=VIP",
      src:"https://www.w3schools.com/html/mov_bbb.mp4"
    });
  }
}

load();
render();
</script>

</body>
</html>
