<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>imovercovidmaylee</title>

<style>

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#0b0b0b;
color:#fff;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
background:#111;
position:sticky;
top:0;
z-index:100;
}

.logo{
color:#e50914;
font-size:28px;
font-weight:bold;
}

nav a{
margin-left:20px;
text-decoration:none;
color:#fff;
}

.hero{
height:350px;
background:linear-gradient(to top,#000,#111);
display:flex;
align-items:center;
padding:40px;
}

.hero h1{
font-size:45px;
}

.container{
padding:30px;
}

.row{
margin-bottom:40px;
}

.row h2{
border-left:5px solid #e50914;
padding-left:10px;
}

.videos{
display:flex;
gap:15px;
overflow-x:auto;
}

.video-card{
min-width:220px;
cursor:pointer;
position:relative;
}

.video-card img{
width:100%;
border-radius:8px;
}

.vip{
position:absolute;
top:10px;
left:10px;
background:gold;
color:black;
padding:3px 6px;
font-weight:bold;
border-radius:4px;
}

#playerModal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
justify-content:center;
align-items:center;
}

#playerModal video{
max-width:90%;
max-height:90%;
}

.close{
position:absolute;
top:20px;
right:30px;
font-size:40px;
cursor:pointer;
}

.adminPanel{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#222;
padding:25px;
border-radius:10px;
z-index:999;
}

input,select{
padding:10px;
margin-bottom:10px;
width:250px;
}

button{
padding:10px 20px;
background:#e50914;
border:none;
color:white;
cursor:pointer;
}

.payment{
background:#111;
text-align:center;
padding:40px;
}

footer{
text-align:center;
padding:20px;
background:#111;
}

</style>
</head>

<body>

<header>

<div class="logo">imovercovidmaylee</div>

<nav>
<a href="#">Home</a>
<a href="#payment">VIP</a>
</nav>

</header>

<section class="hero">

<div>
<h1>Unlimited Streaming</h1>
<p>Watch exclusive content anytime.</p>
</div>

</section>

<div class="container">

<div class="row">

<h2>Free Videos</h2>

<div class="videos" id="freeRow"></div>

</div>

<div class="row">

<h2>VIP Videos</h2>

<div class="videos" id="vipRow"></div>

</div>

</div>

<section class="payment" id="payment">

<h2>Unlock VIP Access</h2>

<p>$100 one-time payment</p>

<button onclick="stripePay()">Pay with Stripe</button>

<button onclick="cryptoPay()">Pay with Crypto</button>

</section>

<div id="playerModal">

<span class="close" onclick="closePlayer()">×</span>

<video controls id="player"></video>

</div>

<div class="adminPanel" id="admin">

<h3>Admin Upload</h3>

<input id="videoURL" placeholder="Video URL (.mp4)">

<br>

<select id="videoType">
<option value="free">Free</option>
<option value="vip">VIP</option>
</select>

<br>

<button onclick="addVideo()">Upload Video</button>

</div>

<footer>

<p>Contact Telegram</p>

<a href="https://t.me/maylee-covid0001">@maylee-covid0001</a>

</footer>

<script>

let paid=false

let freeVideos=JSON.parse(localStorage.getItem("freeVideos"))||[
"https://www.w3schools.com/html/mov_bbb.mp4"
]

let vipVideos=JSON.parse(localStorage.getItem("vipVideos"))||[
"https://www.w3schools.com/html/movie.mp4"
]

function save(){
localStorage.setItem("freeVideos",JSON.stringify(freeVideos))
localStorage.setItem("vipVideos",JSON.stringify(vipVideos))
}

function thumbnail(video){

const canvas=document.createElement("canvas")
canvas.width=320
canvas.height=180

const ctx=canvas.getContext("2d")
ctx.drawImage(video,0,0,320,180)

return canvas.toDataURL()

}

function render(){

const freeRow=document.getElementById("freeRow")
const vipRow=document.getElementById("vipRow")

freeRow.innerHTML=""
vipRow.innerHTML=""

freeVideos.forEach(src=>{

const card=document.createElement("div")
card.className="video-card"

const vid=document.createElement("video")
vid.src=src

vid.addEventListener("loadeddata",()=>{

card.innerHTML=`<img src="${thumbnail(vid)}">`

})

card.onclick=()=>play(src,false)

freeRow.appendChild(card)

})

vipVideos.forEach(src=>{

const card=document.createElement("div")
card.className="video-card"

const vid=document.createElement("video")
vid.src=src

vid.addEventListener("loadeddata",()=>{

card.innerHTML=`<img src="${thumbnail(vid)}"><div class="vip">VIP</div>`

})

card.onclick=()=>play(src,true)

vipRow.appendChild(card)

})

}

function play(src,vip){

if(vip && !paid){

alert("VIP only. Please purchase access.")

return

}

document.getElementById("player").src=src
document.getElementById("playerModal").style.display="flex"

}

function closePlayer(){

document.getElementById("playerModal").style.display="none"

document.getElementById("player").pause()

}

function stripePay(){

alert("Connect Stripe API here")

}

function cryptoPay(){

alert("Connect Crypto payment gateway here")

}

function addVideo(){

const url=document.getElementById("videoURL").value
const type=document.getElementById("videoType").value

if(!url)return alert("Enter video URL")

if(type==="free"){
freeVideos.push(url)
}else{
vipVideos.push(url)
}

save()
render()

}

document.addEventListener("keydown",e=>{

if(e.ctrlKey && e.shiftKey && e.key==="A"){

document.getElementById("admin").style.display="block"

}

})

render()

</script>

</body>
</html>
