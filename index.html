<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>imovercovidmaylee</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<style>
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}

/* HEADER */
header{
display:flex;
justify-content:space-between;
padding:20px;
background:#111;
}

.logo{color:#e50914;font-size:26px}

/* GRID */
.videos{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:15px;
padding:20px;
}

.card{
cursor:pointer;
position:relative;
transition:0.3s;
}
.card:hover{transform:scale(1.05)}

.card img{
width:100%;
height:130px;
object-fit:cover;
border-radius:8px;
}

/* VIP */
.vip{
position:absolute;
top:10px;
left:10px;
background:gold;
color:black;
padding:3px 6px;
}

/* MODAL */
#modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
justify-content:center;
align-items:center;
z-index:1000;
}

#modal video,#modal img{max-width:90%}

/* SECTIONS */
.login,.payment,.admin{
padding:20px;
}

.wallet{
background:#222;
padding:10px;
margin:10px 0;
}

/* ADMIN PANEL */
#adminPanel{
display:none;
background:#111;
padding:20px;
border-top:2px solid #e50914;
}

button{
padding:10px;
background:#e50914;
border:none;
color:white;
cursor:pointer;
margin-top:5px;
}
</style>
</head>

<body>

<header>
<div class="logo">imovercovidmaylee</div>
<button onclick="toggleAdmin()">Admin</button>
</header>

<!-- LOGIN -->
<div class="login">
<input id="username" placeholder="Enter username">
<button onclick="login()">Login</button>
</div>

<h2 style="padding-left:20px;">Free Videos</h2>
<div id="free" class="videos"></div>

<h2 style="padding-left:20px;">VIP Videos</h2>
<div id="vip" class="videos"></div>

<!-- PAYMENT -->
<div class="payment">
<h2>Crypto Payment</h2>

<div class="wallet">BTC: YOUR_BTC_ADDRESS</div>
<div class="wallet">ETH: YOUR_ETH_ADDRESS</div>
<div class="wallet">USDT: YOUR_USDT_ADDRESS</div>

<button onclick="requestAccess()">I HAVE PAID</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="admin">
<h3>Admin Dashboard</h3>

<input id="thumb" placeholder="Thumbnail URL">
<input id="src" placeholder="Video/Image URL">
<label>VIP</label>
<input type="checkbox" id="isVip">

<button onclick="addVideo()">Add Video</button>
</div>

<!-- MODAL -->
<div id="modal" onclick="closeModal()"></div>

<script>

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* USER SYSTEM */
let currentUser = localStorage.getItem("user");
let paidUsers = JSON.parse(localStorage.getItem("paidUsers")||"[]");

/* LOGIN */
function login(){
currentUser = document.getElementById("username").value;
localStorage.setItem("user",currentUser);
alert("Logged in as "+currentUser);
}

/* LOAD VIDEOS */
function loadVideos(){
db.collection("videos").onSnapshot(snapshot=>{
free.innerHTML="";
vip.innerHTML="";

snapshot.forEach(doc=>{
let v = doc.data();

let card=document.createElement("div");
card.className="card";

card.innerHTML=`
<img src="${v.thumb}">
${v.vip?'<div class="vip">VIP</div>':''}
`;

card.onclick=()=>play(v);

if(v.vip) vip.appendChild(card);
else free.appendChild(card);
});
});
}

/* PLAY */
function play(v){

if(v.vip && !paidUsers.includes(currentUser)){
alert("VIP locked. Pay first.");
return;
}

let modal=document.getElementById("modal");

if(v.src.match(/\.(jpg|png|jpeg|gif|webp)$/i)){
modal.innerHTML=`<img src="${v.src}">`;
}else{
modal.innerHTML=`<video src="${v.src}" controls autoplay></video>`;
}

modal.style.display="flex";
}

/* CLOSE */
function closeModal(){
document.getElementById("modal").style.display="none";
}

/* CRYPTO */
function requestAccess(){

if(!currentUser){
alert("Login first");
return;
}

/* DEMO UNLOCK */
paidUsers.push(currentUser);
localStorage.setItem("paidUsers",JSON.stringify(paidUsers));

alert("Access granted (demo)");
}

/* ADMIN */
function toggleAdmin(){
let pass=prompt("Admin password:");
if(pass==="1234"){
let panel=document.getElementById("adminPanel");
panel.style.display = panel.style.display==="block"?"none":"block";
}
}

/* ADD VIDEO */
function addVideo(){
db.collection("videos").add({
thumb:thumb.value,
src:src.value,
vip:isVip.checked
});
alert("Video added!");
}

/* INIT */
loadVideos();

</script>

</body>
</html>
